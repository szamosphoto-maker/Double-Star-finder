name: Build DuoStar Finder Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DuoStar_Finder --collect-all astropy duostar_finder_gui.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DuoStar_Finder_Windows
          path: dist/DuoStar_Finder.exe
          if-no-files-found: error
